name: Prepare or publish releases

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: release-please-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    name: CI
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
    uses: ./.github/workflows/check.yml

  release-please:
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      has-releases: ${{ steps.plan.outputs.has-releases }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ secrets.PAT_TOKEN || github.token }}
          target-branch: main
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          # Preparing version PRs never requires enabling npm publication.
          skip-github-release: ${{ vars.NPM_PUBLISH_ENABLED != 'true' }}
      - uses: actions/checkout@v4
        if: vars.NPM_PUBLISH_ENABLED == 'true'
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        if: vars.NPM_PUBLISH_ENABLED == 'true'
      - uses: actions/setup-node@v4
        if: vars.NPM_PUBLISH_ENABLED == 'true'
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
        if: vars.NPM_PUBLISH_ENABLED == 'true'
      - name: Select draft or public releases tagged at this exact commit
        id: plan
        if: vars.NPM_PUBLISH_ENABLED == 'true'
        run: node scripts/release.mjs plan
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/upload-artifact@v4
        if: steps.plan.outputs.has-releases == 'true'
        with:
          name: release-plan
          path: .artifacts/release-plan.json
          include-hidden-files: true
          if-no-files-found: error

  pack:
    needs: release-please
    if: vars.NPM_PUBLISH_ENABLED == 'true' && needs.release-please.outputs.has-releases == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: release-plan
          path: .artifacts
      - run: pnpm build && pnpm pack:check
      - uses: actions/upload-artifact@v4
        with:
          name: release-packages
          path: |
            .artifacts/release-plan.json
            .artifacts/*.tgz
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: pack
    if: vars.NPM_PUBLISH_ENABLED == 'true' && needs.pack.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: release-packages
          path: .artifacts
      - name: Publish verified archives, then expose matching GitHub releases
        run: node scripts/release.mjs publish
        env:
          GH_TOKEN: ${{ github.token }}
          PNPM_CONFIG_REGISTRY: https://registry.npmjs.org
          PNPM_CONFIG_PROVENANCE: "true"
